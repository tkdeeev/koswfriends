<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172d3b">
  <title>KOSwFriends · Offline</title>
  <style>
    :root { color-scheme:light dark; font-family:system-ui,sans-serif; background:#fff; color:#172d3b }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; box-sizing:border-box }
    main { max-width:360px; width:100% }
    h1 { font-size:28px; font-weight:600 } p { line-height:1.6 }
    button { font:inherit; min-height:48px; padding:12px 20px; border:0; background:#0079c1; color:white; cursor:pointer }
    button:focus-visible { outline:3px solid #f2ac27; outline-offset:3px }
    :root[data-theme="dark"] { background:#141f29; color:#e7edf3 }
    @media(prefers-color-scheme:dark) { :root:not([data-theme="light"]) { background:#141f29; color:#e7edf3 } }
  </style>
</head>
<body><main><h1>Offline</h1><p id="message">Reconnect to load your timetable.</p><button id="retry">Try again</button></main>
<script>
  let language = navigator.language;
  try { language = localStorage.getItem('kwf_locale') || language; document.documentElement.dataset.theme = localStorage.getItem('kwf_theme') || ''; } catch {}
  if (language.startsWith('cs')) { document.documentElement.lang = 'cs'; document.getElementById('message').textContent = 'Pro načtení rozvrhu se připojte k internetu.'; document.getElementById('retry').textContent = 'Zkusit znovu'; }
  if (language.startsWith('uk')) { document.documentElement.lang = 'uk'; document.title = 'KOSwFriends · Немає з’єднання'; document.querySelector('h1').textContent = 'Немає з’єднання'; document.getElementById('message').textContent = 'Підключіться до інтернету, щоб завантажити розклад.'; document.getElementById('retry').textContent = 'Спробувати ще раз'; }
  document.getElementById('retry').addEventListener('click', () => location.reload());
  window.addEventListener('online', () => location.reload());
</script></body></html>
