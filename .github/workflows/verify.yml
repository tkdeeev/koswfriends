name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: docker build -t koswfriends:verify .
      - name: Verify packaged logo
        run: docker run --rm --entrypoint test koswfriends:verify -s /app/public/logo.svg
      - name: Verify packaged PWA and preview assets
        run: docker run --rm --entrypoint sh koswfriends:verify -c 'test -s public/sw.js && test -s public/offline.html && test -s public/icons/icon-192.png && test -s public/icons/icon-512.png && test -s public/icons/maskable-512.png && test -s public/icons/apple-touch-icon.png && test -s public/preview/timetable-en-light.png && test -s public/preview/timetable-cs-dark.png && test -s public/preview/timetable-uk-light.png && test -s public/preview/timetable-uk-dark.png'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          {
            name: synthetic-browser-results,
            path: test-results/,
            retention-days: 7,
          }
